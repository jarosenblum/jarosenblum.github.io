# Site configuration — user site, served from the main branch root (D1, D2).
title: Jason Rosenblum
description: AI and education portfolio
# Link previews (see _layouts/default.html)
social_image: "/assets/social-card.png"
social_image_alt: "Jason Rosenblum, AI and education portfolio: I design learning experiences and build the AI tools behind them, for instructors, researchers, and students. Three screenshots from the work."
social_description: "I design learning experiences and build the AI tools behind them, for instructors, researchers, and students."
url: "https://jarosenblum.github.io"
baseurl: ""
lang: en
# Address used by "Request a key" buttons (owner-confirmed 2026-10-28).
contact_email: "jarosenblum@gmail.com"
# Pre-launch switch. While false, every page carries <meta name="robots"
# content="noindex"> so search engines skip test builds. Set true at P5.
launched: true

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

collections:
  case_studies:
    output: true
    permalink: /work/:name/

defaults:
  - scope:
      path: ""
      type: case_studies
    values:
      layout: case
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - README.md
  - scripts/
  - Gemfile
  - Gemfile.lock
  - _case_studies/_TEMPLATE.md
